# ==========================================
# 1. SITE PRINCIPAL: jeffgsan.com.br
# ==========================================
server {
    listen 80;
    server_name jeffgsan.com.br;

    root /usr/share/nginx/html;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jeffgsan.com.br;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/jeffgsan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeffgsan.com.br/privkey.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ==========================================
# 2. APLICAÇÃO UNIFI: unifi.jeffgsan.com.br
# ==========================================
server {
    listen 80;
    server_name unifi.jeffgsan.com.br;

    root /usr/share/nginx/html;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name unifi.jeffgsan.com.br;

    ssl_certificate /etc/letsencrypt/live/unifi.jeffgsan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unifi.jeffgsan.com.br/privkey.pem;

    location / {
        proxy_pass https://172.20.86.50:8443;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==========================================
# 3. APLICAÇÃO MEUPROVEDOR: bkp.jeffgsan.com.br
# ==========================================
server {
    listen 80;
    server_name bkp.jeffgsan.com.br;

    root /usr/share/nginx/html;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bkp.jeffgsan.com.br;

    ssl_certificate /etc/letsencrypt/live/bkp.jeffgsan.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bkp.jeffgsan.com.br/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://172.20.86.50:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

