services:
  nginx:
    image: nginx:alpine
    container_name: nginx-landing
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 48M
          cpus: "0.15"
    restart: unless-stopped
    networks:
      - default
      - web_net

networks:
  default:
  web_net:
    external: true
